name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    name: Test chameleon-core
    runs-on: ubuntu-latest
    env:
      CHAMELEON_HEADLESS: "1"
      CHAMELEON_NO_SANDBOX: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Linux 上 detect_browser 命中 /usr/bin/google-chrome；装 Chrome 供集成测试用
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1

      - name: Run chameleon-core tests
        run: cargo test -p chameleon-core

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
