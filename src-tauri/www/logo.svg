<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1abc9c"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- Chameleon silhouette -->
  <g fill="#ffffff">
    <!-- Body -->
    <ellipse cx="120" cy="135" rx="65" ry="38"/>
    <!-- Head -->
    <circle cx="175" cy="115" r="40"/>
    <!-- Bridge head-body -->
    <ellipse cx="155" cy="125" rx="28" ry="22"/>
    <!-- Casque (head crest) -->
    <polygon points="158,80 175,48 192,80"/>
    <!-- Snout -->
    <polygon points="208,112 228,118 208,128"/>
    <!-- Eye (dark) -->
    <circle cx="185" cy="112" r="13" fill="#1c1b22"/>
    <!-- Pupil -->
    <circle cx="191" cy="111" r="5"/>
    <!-- Tail: spiral curl -->
    <path d="M55,142 C30,142 18,128 18,112 C18,96 32,84 48,84 C60,84 70,92 70,104 C70,112 64,118 56,118 C48,118 42,112 42,104 C42,98 46,94 52,94" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="148" y="165" width="10" height="26" rx="4"/>
    <ellipse cx="153" cy="193" rx="10" ry="8"/>
    <rect x="98" y="162" width="10" height="26" rx="4"/>
    <ellipse cx="103" cy="190" rx="10" ry="8"/>
  </g>
</svg>
