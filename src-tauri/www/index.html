<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chameleon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>chameleon</h1>
        <p class="sub">Chrome 会话隔离管理工具</p>
      </div>
    </div>
    <nav class="toolbar">
      <button id="btn-new-role" class="primary">＋ 新建角色</button>
      <button id="btn-new-system" class="ghost small">＋ 系统</button>
      <span class="sep"></span>
      <button id="btn-launch-all" class="primary">▶ 一键启动</button>
      <button id="btn-close-all">■ 一键关闭</button>
      <button id="btn-sandbox" class="ghost small">沙箱</button>
      <button id="btn-cleanup" class="ghost small">清理</button>
      <span class="sep"></span>
      <button id="btn-export" class="ghost small">导出</button>
      <button id="btn-import" class="ghost small">导入</button>
    </nav>
    <button id="btn-settings" class="win-btn settings-btn" title="设置">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
    <div class="win-controls">
      <button class="win-btn" id="btn-min" title="最小化"><svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="win-btn" id="btn-max" title="最大化"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2" rx="0.5"/></svg></button>
      <button class="win-btn win-close" id="btn-close" title="关闭"><svg viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </header>

  <section class="browser-bar">
    <span class="label">浏览器</span>
    <select id="browser-select" class="browser-select"></select>
    <button id="btn-pick-browser" class="ghost small">浏览…</button>
    <span id="browser-status" class="muted small"></span>
  </section>

  <main>
    <div id="state"></div>
  </main>

  <!-- 新建/编辑角色 -->
  <dialog id="role-dialog" class="dialog">
    <form id="role-form">
      <h3 id="role-dialog-title">新建角色</h3>
      <label>名称（中文名）<input id="role-name" type="text" required placeholder="如：ERP-管理员" /></label>
      <label>颜色色块<input id="role-color" type="color" value="#e74c3c" /></label>
      <label>所属系统<select id="role-system"><option value="">未分组</option></select></label>
      <div class="dialog-actions">
        <button type="button" id="role-cancel" class="ghost">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 新建/编辑系统 -->
  <dialog id="system-dialog" class="dialog">
    <form id="system-form">
      <h3 id="system-dialog-title">新建系统</h3>
      <p id="system-info" class="muted small" style="margin:-4px 0 8px"></p>
      <label>系统名称<input id="system-name" type="text" required placeholder="如：ERP系统" /></label>
      <div class="dialog-actions">
        <button type="button" id="system-cancel" class="ghost">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 接力 -->
  <dialog id="handoff-dialog" class="dialog">
    <div class="handoff">
      <h3>会话接力</h3>
      <div class="handoff-row">
        <div>源角色：<b id="handoff-source"></b></div>
        <div>当前标签页：<span id="handoff-url" class="muted small"></span></div>
      </div>
      <label>目标角色<select id="handoff-target"></select></label>
      <div class="dialog-actions">
        <button type="button" id="handoff-cancel" class="ghost">取消</button>
        <button type="button" id="handoff-parallel" class="primary">并行打开（保留源）</button>
        <button type="button" id="handoff-relay">接力打开（关闭源）</button>
      </div>
    </div>
  </dialog>

  <!-- 预设管理（角色级 + 系统级） -->
  <dialog id="links-dialog" class="dialog wide">
    <div class="links">
      <h3>常用 URL 预设 — <span id="links-owner"></span></h3>
      <div id="links-list" class="links-list"></div>
      <form id="links-form" class="links-form">
        <div class="links-form-row">
          <input id="link-name" type="text" placeholder="名称" required />
          <input id="link-url" type="url" placeholder="https://…" required />
          <label class="check"><input id="link-auto" type="checkbox" /> 启动自动打开</label>
          <label class="check"><input id="link-login-toggle" type="checkbox" /> 登录辅助</label>
          <button type="submit" class="accent" id="links-submit-btn">添加</button>
        </div>
        <div id="links-login-fields" class="links-login-fields">
          <input id="link-login-user" type="text" placeholder="用户名" />
          <input id="link-login-pass" type="password" placeholder="密码" />
          <input id="link-login-usel" type="text" placeholder="用户名选择器（留空自动找）" />
          <input id="link-login-psel" type="text" placeholder="密码选择器（留空自动找）" />
        </div>
      </form>
      <div class="dialog-actions">
        <button type="button" id="links-close" class="ghost">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 删除系统确认 -->
  <dialog id="delete-system-dialog" class="dialog">
    <div class="delete-system">
      <h3>删除系统「<span id="delete-system-name"></span>」</h3>
      <p class="muted small" id="delete-system-info" style="margin:-2px 0 12px"></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button type="button" id="delete-system-with-roles" class="danger">删除系统 + 所有角色</button>
        <button type="button" id="delete-system-keep-roles">只删系统，保留角色</button>
        <button type="button" id="delete-system-cancel" class="ghost">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 设置面板 -->
  <dialog id="settings-dialog" class="dialog settings-dialog">
    <div class="settings">
      <h3>设置</h3>

      <div class="settings-group">
        <label class="settings-label">主题</label>
        <div class="settings-radio-group">
          <label><input type="radio" name="theme" value="Dark" /> 深色</label>
          <label><input type="radio" name="theme" value="Light" /> 浅色</label>
          <label><input type="radio" name="theme" value="System" /> 跟随系统</label>
        </div>
      </div>

      <div class="settings-group">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <label class="settings-label" for="opacity-slider">面板透明度</label>
          <span id="opacity-value" class="settings-value">72%</span>
        </div>
        <input type="range" id="opacity-slider" min="0.5" max="1.0" step="0.05" value="0.72" />
      </div>

      <div class="settings-group">
        <label class="settings-label">Accent 颜色</label>
        <div class="accent-picker" id="accent-picker">
          <button type="button" class="accent-dot" data-color="#1abc9c" style="background:#1abc9c" title="青绿"></button>
          <button type="button" class="accent-dot" data-color="#3498db" style="background:#3498db" title="蓝"></button>
          <button type="button" class="accent-dot" data-color="#9b59b6" style="background:#9b59b6" title="紫"></button>
          <button type="button" class="accent-dot" data-color="#e74c3c" style="background:#e74c3c" title="红"></button>
          <button type="button" class="accent-dot" data-color="#f39c12" style="background:#f39c12" title="橙"></button>
          <button type="button" class="accent-dot" data-color="#2ecc71" style="background:#2ecc71" title="绿"></button>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="settings-close" class="ghost">关闭</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
