[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync", "signal"] }
chromiumoxide = "0.9"
chromiumoxide_cdp = "0.9"
futures = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
url = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fs2 = "0.4"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1